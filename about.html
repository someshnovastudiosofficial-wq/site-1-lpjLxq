<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACADEMIX Academy - About Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --light: #f8fafc; --text: #334155; --font: 'Poppins', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font); color: var(--text); background: var(--light); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; transition: 0.3s; }
        nav.navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; z-index: 1000; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .nav-left { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }
        .nav-left a { font-weight: 600; color: var(--dark); text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; }
        .nav-left a:hover { color: var(--primary); }
        .nav-right img { height: 50px; width: auto; object-fit: contain; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .page-header { height: 50vh; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; margin-bottom: 4rem; }
        .page-header::before { content: ""; position: absolute; inset: 0; background: rgba(15,23,42,0.8); }
        .page-header h1 { position: relative; z-index: 2; color: #fff; font-size: 3.5rem; font-weight: 800; animation: fadeIn 1s ease-out forwards; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px 5rem 20px; animation: fadeIn 1s ease-out 0.3s forwards; opacity: 0; }
        .about-text { font-size: 1.1rem; margin-bottom: 4rem; text-align: center; }
        .staff-section h2 { text-align: center; font-size: 2.5rem; color: var(--dark); margin-bottom: 3rem; }
        .staff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; }
        .staff-card { background: #fff; border-radius: 1rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); text-align: center; padding-bottom: 2rem; transition: transform 0.3s ease; }
        .staff-card:hover { transform: translateY(-10px); }
        .staff-card img { width: 100%; height: 250px; object-fit: cover; margin-bottom: 1.5rem; }
        .staff-card h3 { color: var(--dark); font-size: 1.3rem; }
        .staff-card p { color: var(--primary); font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        footer { background: var(--dark); color: #fff; text-align: center; padding: 2rem 5%; font-size: 0.9rem; margin-top: auto; }
        @media (max-width: 768px) { .page-header h1 { font-size: 2.2rem; } nav.navbar { padding: 1rem; } .nav-left { gap: 1rem; } }
    </style>
</head>
<body>

        </div>
        <div class="nav-right">
            <img src="assets/default-logo.png" alt="School Logo">
        </div>
    </nav>
    <header class="page-header" style="background-image: url('assets/about_bg_9be8fde4.jpg');">
        <h1>Jantraji devi vidya mandir</h1>
    </header>
    <div class="container">
        <div class="about-text">
            <p>Jantraji devi vidya mandir</p>
        </div>
        <div class="staff-section">
            <h2>Meet Our Team</h2>
            <div class="staff-grid">
                
                <div class="staff-card">
                    <img src="assets/staff_photo_4c7c2f14.png" alt="Staff Photo">
                    <h3>Jantraji devi vidya mandir</h3>
                    <p>Jantraji devi vidya mandir</p>
                </div>
                
            </div>
        </div>
    </div>
    <footer>
        <p>POWERED BY ACADEMIX 2 a product of Somesh nova studios@2026-all rights reserved</p>

</body>
</html>
