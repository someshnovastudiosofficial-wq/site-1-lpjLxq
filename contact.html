<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACADEMIX Academy - Contact Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --light: #f8fafc; --text: #334155; --font: 'Poppins', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font); color: var(--text); background: var(--light); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; transition: 0.3s; }
        nav.navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; z-index: 1000; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .nav-left { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }
        .nav-left a { font-weight: 600; color: var(--dark); text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; }
        .nav-left a:hover { color: var(--primary); }
        .nav-right img { height: 50px; width: auto; object-fit: contain; }
        .page-header { height: 40vh; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 4rem; margin-top: 80px; }
        .page-header::before { content: ""; position: absolute; inset: 0; background: rgba(15,23,42,0.8); }
        .page-header h1 { position: relative; z-index: 2; color: #fff; font-size: 3rem; font-weight: 800; }
        .contact-container { max-width: 1200px; margin: 0 auto; padding: 0 20px 5rem 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
        .contact-info { background: #fff; padding: 3rem; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .contact-info h2 { color: var(--primary); margin-bottom: 1.5rem; }
        .contact-info p { font-size: 1.1rem; margin-bottom: 1rem; }
        .contact-info strong { color: var(--dark); }
        .map-container iframe { width: 100%; height: 100%; min-height: 400px; border: 0; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        footer { background: var(--dark); color: #fff; text-align: center; padding: 2rem 5%; font-size: 0.9rem; margin-top: auto; }
        @media (max-width: 768px) { .contact-container { grid-template-columns: 1fr; } .nav-left { gap: 1rem; } }
    </style>
</head>
