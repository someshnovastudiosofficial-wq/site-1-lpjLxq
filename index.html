<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACADEMIX Academy - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #2563eb; 
            --dark: #0f172a; 
            --light: #f8fafc; 
            --text: #334155; 
            --academix-orange: #f97316; /* Added Orange for footer */
            --font: 'Poppins', sans-serif; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font); color: var(--text); background: var(--light); line-height: 1.6; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; transition: 0.3s; }
        
        /* --- UPGRADED NAVIGATION --- */
        nav.navbar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 1rem 5%; background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; z-index: 1000; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
        }
        .nav-left { display: flex; gap: 2rem; align-items: center; transition: 0.3s ease-in-out; }
        .nav-left a { font-weight: 600; color: var(--dark); text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; }
        .nav-left a:hover { color: var(--primary); }
        
        /* Hamburger Button (Hidden on Desktop) */
        .menu-toggle { display: none; background: none; border: none; cursor: pointer; color: var(--dark); padding: 5px; }
        
        /* --- UPGRADED LOGO FRAMES --- */
        .nav-right { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; background: #fff; }
        .nav-right img { width: 100%; height: 100%; }
        
        .logo-transparent { background: transparent; border-radius: 0; box-shadow: none; height: 50px; width: auto; }
        .logo-transparent img { object-fit: contain; }
        
        .logo-round { border-radius: 50%; width: 60px; height: 60px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 2px solid #fff; }
        .logo-round img { object-fit: cover; }
        
        .logo-square { border-radius: 12px; width: 60px; height: 60px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 4px; }
        .logo-square img { object-fit: contain; }
        
        .logo-rectangle { border-radius: 8px; width: auto; height: 50px; padding: 4px 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .logo-rectangle img { object-fit: contain; }

        /* Animations */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: fadeInUp 1s ease-out forwards; }
        
        /* Hero & Features */
        .hero { height: 100vh; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; padding: 0 20px; }
        .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(15,23,42,0.7), rgba(15,23,42,0.9)); }
        .hero-content { position: relative; z-index: 2; color: #fff; max-width: 800px; }
        .hero h1 { font-size: 4rem; font-weight: 800; margin-bottom: 1rem; line-height: 1.2; }
        .hero p { font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.9; }
        
        .features { padding: 5rem 5%; max-width: 1200px; margin: 0 auto; }
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 3rem; }
        .feature-card { background: #fff; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); transition: transform 0.3s ease; opacity: 0; animation: fadeInUp 0.8s ease-out 0.5s forwards; }
        .feature-card:hover { transform: translateY(-10px); }
        .feature-card h3 { color: var(--dark); font-size: 1.5rem; margin-bottom: 1rem; }
        
        /* --- UPGRADED FOOTER --- */
        footer { 
            background: var(--dark); color: #fff; padding: 1.5rem 5%; margin-top: auto;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;
        }
        .footer-center { grid-column: 2; text-align: center; font-size: 0.95rem; font-weight: 400; letter-spacing: 0.5px; }
        .footer-right { grid-column: 3; text-align: right; color: var(--academix-orange); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }

        /* --- MOBILE SCALING & RESPONSIVENESS --- */
        @media (max-width: 850px) { 
            .menu-toggle { display: block; }
            .nav-left { 
                position: absolute; top: 100%; left: 0; width: 100%; 
                background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px);
                flex-direction: column; padding: 0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
                max-height: 0; overflow: hidden; gap: 0;
            }
            .nav-left.active { max-height: 400px; padding: 1rem 0; }
            .nav-left a { padding: 1rem 2rem; width: 100%; text-align: center; border-bottom: 1px solid #eee; }
            .nav-left a:last-child { border-bottom: none; }
            
            .hero h1 { font-size: 2.5rem; } 
            .hero p { font-size: 1rem; } 
            
            /* Stack footer on mobile */
            footer { grid-template-columns: 1fr; text-align: center; gap: 1.5rem; padding: 2rem 5%; }
            .footer-center { grid-column: 1; order: 1; }
            .footer-right { grid-column: 1; order: 2; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Dynamic Navigation -->
    <nav class="navbar">
        <!-- Mobile Hamburger Button -->
        <button class="menu-toggle" aria-label="Toggle Menu" onclick="toggleMenu()">
            <svg viewBox="0 0 24 24" width="30" height="30" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <div class="nav-left" id="navLinks">
            
                <a href="index.html">Home</a>
            
                <a href="about.html">About Us</a>
            
                <a href="management.html">Management</a>
            
                <a href="admission.html">Admissions</a>
            
                <a href="contact.html">Contact</a>
            
                <a href="privacy.html">Privacy Policy</a>
            
        </div>
        
        <!-- Dynamic Logo Frame Integration -->
        <div class="nav-right logo-transparent">
            <img src="assets/default-logo.png" alt="School Logo">
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero" style="background-image: url('assets/hero_bg_74f75463.jpg');">
        <div class="hero-content animate-up">
            <h1>Jantraji devi vidya mandir</h1>
            <p>Jantraji devi vidya mandir</p>
        </div>
    </header>

    <!-- Dynamic Features -->
    <section class="features">
        <div class="features-grid">
            
            <div class="feature-card">
                <h3>Jantraji devi vidya mandir</h3>
                <p>Jantraji devi vidya mandir</p>
            </div>
            
        </div>
    </section>

    <!-- New Grid Footer -->
    <footer>
        <div></div> <!-- Empty div to keep the center column perfectly centered via Flex/Grid -->
        
        <div class="footer-center">
            ACADEMIX Academy@2026-all rights reserved
        </div>
        
        <div class="footer-right">
            POWERED BY ACADEMIX 2 a product of Somesh nova studios@2026-all rights reserved
        </div>
    </footer>

    <!-- Mobile Menu Script -->
    <script>
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }
    </script>

</body>
</html>
