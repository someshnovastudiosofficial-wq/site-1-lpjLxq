<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somesh vidya mandir - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; --light: #f8fafc; --text: #334155; --font: 'Poppins', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font); color: var(--text); background: var(--light); line-height: 1.6; overflow-x: hidden; }
        a { text-decoration: none; transition: 0.3s; }
        nav.navbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0; z-index: 1000; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .nav-left { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }
        .nav-left a { font-weight: 600; color: var(--dark); text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; }
        .nav-left a:hover { color: var(--primary); }
        .nav-right img { height: 50px; width: auto; object-fit: contain; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: fadeInUp 1s ease-out forwards; }
        .hero { height: 100vh; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; padding: 0 20px; }
        .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(15,23,42,0.7), rgba(15,23,42,0.9)); }
        .hero-content { position: relative; z-index: 2; color: #fff; max-width: 800px; }
        .hero h1 { font-size: 4rem; font-weight: 800; margin-bottom: 1rem; line-height: 1.2; }
        .hero p { font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.9; }
        .features { padding: 5rem 5%; max-width: 1200px; margin: 0 auto; }
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 3rem; }
        .feature-card { background: #fff; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); transition: transform 0.3s ease; opacity: 0; animation: fadeInUp 0.8s ease-out 0.5s forwards; }
        .feature-card:hover { transform: translateY(-10px); }
        .feature-card h3 { color: var(--dark); font-size: 1.5rem; margin-bottom: 1rem; }
        footer { background: var(--dark); color: #fff; text-align: center; padding: 2rem 5%; font-size: 0.9rem; margin-top: auto; }
        @media (max-width: 768px) { .hero h1 { font-size: 2.5rem; } .hero p { font-size: 1rem; } nav.navbar { padding: 1rem; } .nav-left { gap: 1rem; } }
    </style>
</head>

</body>
